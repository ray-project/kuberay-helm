# Keep the action and tool versions in sync with KubeRay so both repos lint the charts the same way.
name: Lint and Test Charts

on:
  push:
    branches:
    - main
    - release-*
  pull_request:
    branches:
    - main
    - release-*

env:
  CHART_DIR: helm-chart

jobs:
  lint-test:
    name: lint-test-${{ matrix.chart }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        chart:
          - kuberay-operator
          - kuberay-apiserver
          - ray-cluster

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.17.3

      - uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install Helm unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 0.8.1

      - name: Run Helm unittest
        run: helm unittest ${{ env.CHART_DIR }}/${{ matrix.chart }} --file "tests/**/*_test.yaml" --strict --debug

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        # Run 'helm lint', version checking, YAML schema validation on 'Chart.yaml',
        # YAML linting on 'Chart.yaml' and 'values.yaml', and maintainer.
        # [Doc]: https://github.com/helm/chart-testing/blob/main/doc/ct_lint.md
        run: ct lint --charts ${{ env.CHART_DIR }}/${{ matrix.chart }} --validate-maintainers=false
